<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Chrono — Quick Setup</title>
  <style>
    body { font-family: system-ui, Arial; padding: 24px; }
    .container { max-width: 520px; margin: 0 auto; }
    button { padding: 10px 16px; font-size: 16px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Welcome to Chrono</h2>
    <p>Quick customization: choose initial preferences or skip to start the app.</p>
    <label>
      <input type="checkbox" id="useCloud" checked /> Use Supabase cloud sync when signed in
    </label>
    <p>
      <button id="continue">Continue to Chrono</button>
    </p>
  </div>
  <script>
    const { ipcRenderer } = require('electron');
    document.getElementById('continue').addEventListener('click', () => {
      const useCloud = document.getElementById('useCloud').checked;
      ipcRenderer.send('customization-done', { useCloud });
    });
  </script>
</body>
</html>
